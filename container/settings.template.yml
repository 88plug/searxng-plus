# SearXNG-Plus first-run settings template.
# Full documentation: https://github.com/88plug/searxng-plus/blob/searxng-plus/docs/PLUS.md

use_default_settings: true

general:
  instance_name: "SearXNG-Plus"

server:
  secret_key: "ultrasecretkey"
  image_proxy: true
  limiter: false

search:
  autocomplete: duckduckgo
  favicon_resolver: duckduckgo

brand:
  display_instance_name: true

# Plus-added and plus-tuned engines: enabled on first run.
